name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [main]
    # This line ensures the backend ONLY redeploys if you edit backend files!
    paths:
      - 'ai-backend/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync specific folder to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: carolpinto/Email-Copilot-Backend
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
          subdirectory: ai-backend